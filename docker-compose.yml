# 一键启动 slink + Redis（带密码）
# 密码与初始账号可在同目录 .env 中覆盖（参考 .env.example），未设置时用下方默认值：
#   docker compose up -d --build
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-slink123}
      - --maxmemory
      - 256mb
      # 不静默淘汰：auth token / 布隆过滤器 / Stream 不允许被 LRU 逐出
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-slink123} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  slink:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SLINK_REDIS_ADDR: redis:6379
      SLINK_REDIS_PASSWORD: ${REDIS_PASSWORD:-slink123}
      SLINK_DATABASE_PATH: /app/data/slink.db
      SLINK_SERVER_MODE: release
      # 首次启动的初始账号；之后以「设置」页修改的为准
      SLINK_AUTH_USERNAME: ${SLINK_USERNAME:-admin}
      SLINK_AUTH_PASSWORD: ${SLINK_PASSWORD:-admin123}
      # 管理后台隐藏入口（单域即可，简单推荐）：配置后根路径与 /login 均 404，
      # 管理界面只在 https://你的域名/这个路径 下可见，路径请用随机的难猜值
      # SLINK_ADMIN_PATH: my-secret-panel
      # 如需双域名严格分离（配置后该域只提供跳转服务，管理界面走其他域名反代）：
      # SLINK_SHORTLINK_DOMAIN: https://s.example.com
      # 前置 Nginx/Caddy 反代时必须配置受信代理网段，否则限速/统计只能看到代理 IP：
      # SLINK_SERVER_TRUSTED_PROXIES: 172.16.0.0/12
    volumes:
      - slink-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  slink-data:
