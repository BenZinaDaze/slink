# 一键启动 slink + Redis（带密码）
# 密码与初始账号可在同目录 .env 中覆盖（参考 .env.example），未设置时用下方默认值：
#   docker compose up -d --build
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-slink123}
      - --maxmemory
      - 256mb
      # 不静默淘汰：auth token / 布隆过滤器 / Stream 不允许被 LRU 逐出
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-slink123} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  slink:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SLINK_REDIS_ADDR: redis:6379
      SLINK_REDIS_PASSWORD: ${REDIS_PASSWORD:-slink123}
      SLINK_DATABASE_PATH: /app/data/slink.db
      SLINK_SERVER_MODE: release
      # 首次启动的初始账号；之后以「设置」页修改的为准
      SLINK_AUTH_USERNAME: ${SLINK_USERNAME:-admin}
      SLINK_AUTH_PASSWORD: ${SLINK_PASSWORD:-admin123}
      # 管理后台隐藏入口（见 .env.example；配置后根路径与 /login 均 404）
      SLINK_ADMIN_PATH: ${SLINK_ADMIN_PATH:-}
      # 前置 Nginx 反代时填代理来源 IP（见 .env.example），直连暴露可留空
      SLINK_SERVER_TRUSTED_PROXIES: ${SLINK_SERVER_TRUSTED_PROXIES:-}
    volumes:
      - slink-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  slink-data:
